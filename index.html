<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- cover: draw under notches and the home indicator; the HUD, the touch
         controls and the menus pad themselves with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120b0a" />
    <!-- Keep the art-directed light palette: opt out of Chrome Auto Dark Theme
         and the Dark Reader extension, which repaint the paper panels dark. -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="A 3D shinobi arena game with character-specific bombs, village stages, and tailed-beast boss fights."
    />
    <title>Explosive Shinobi Arena</title>
    <!-- The title screen's largest image. A CSS background set from JS is
         invisible to the preload scanner, so name it here. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/src/assets/ninja-bomber-hero-leaf.webp"
      fetchpriority="high"
    />
    <!-- The title's display face (SIL OFL, public/fonts): fetched with the
         page so the static title below is set in it, not swapped later. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bangers-latin.woff2" crossorigin />
    <!-- Static first paint: the title screen's frame, art and copy, drawn
         before the JS arrives. React replaces #root's content on mount.
         Mirrors the hero in src/view/WelcomeScreen/WelcomeScreen.styles.ts;
         the empty .boot-actions block holds the Quick Play panel's place. -->
    <style>
      .boot {
        position: relative;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background-color: #120d0b;
        background-image: radial-gradient(ellipse at 50% 120%, rgba(245, 130, 31, 0.38), rgba(245, 130, 31, 0) 62%);
        font-family: "Trebuchet MS", "Arial Narrow", Arial, sans-serif;
      }
      @font-face {
        font-family: "Bangers";
        src: url("/fonts/bangers-latin.woff2") format("woff2");
        font-display: swap;
      }
      .boot::before,
      .boot::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }
      .boot::before {
        inset: 0;
        background-image: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 248, 231, 0) 0deg 2.2deg,
          rgba(255, 248, 231, 0.13) 2.2deg 3deg, rgba(255, 248, 231, 0) 3deg 5.1deg, rgba(255, 248, 231, 0.07) 5.1deg 5.6deg);
        -webkit-mask-image: radial-gradient(ellipse at 50% 50%, transparent 0 28%, #000 70%);
        mask-image: radial-gradient(ellipse at 50% 50%, transparent 0 28%, #000 70%);
      }
      .boot::after {
        inset: 10px;
        border: 1px solid rgba(245, 130, 31, 0.45);
        box-shadow: inset 0 0 0 3px rgba(18, 13, 11, 0.9), inset 0 0 0 4px rgba(255, 248, 231, 0.12);
      }
      .boot-hero {
        position: relative;
        z-index: 1;
        width: min(1120px, calc(100vw - 40px));
        min-height: min(760px, calc(100dvh - 40px));
        overflow: hidden;
        border-radius: 4px;
        border: 3px solid #17120f;
        box-shadow: 0 0 0 2px rgba(245, 130, 31, 0.85), 10px 10px 0 2px rgba(0, 0, 0, 0.55);
      }
      .boot-scene {
        position: absolute;
        inset: 0;
        background: #bd6a70 url(/src/assets/ninja-bomber-hero-leaf.webp) 0 0 / cover no-repeat;
        filter: saturate(0.9) contrast(1.02) brightness(0.86);
        transform: scale(1.015);
      }
      .boot-scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(14, 9, 7, 0.86) 0%, rgba(20, 11, 6, 0.62) 46%, rgba(60, 24, 6, 0.26) 100%);
      }
      .boot-copy {
        position: relative;
        min-height: min(760px, calc(100dvh - 40px));
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        padding: clamp(28px, 7vh, 72px);
        color: #fff8e7;
      }
      .boot-title {
        max-width: 600px;
        margin: 0;
        color: #f5821f;
        font-family: "Bangers", Impact, "Arial Narrow Bold", "Arial Black", sans-serif;
        font-size: 5.4rem;
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: 0.035em;
        text-transform: uppercase;
        -webkit-text-stroke: 1.5px #17120f;
        text-shadow: 3px 0 0 #17120f, -3px 0 0 #17120f, 0 3px 0 #17120f, 0 -3px 0 #17120f,
          2px 2px 0 #17120f, -2px -2px 0 #17120f, 2px -2px 0 #17120f, -2px 2px 0 #17120f,
          7px 7px 0 #17120f, 0 0 26px rgba(245, 130, 31, 0.45);
        overflow-wrap: anywhere;
      }
      .boot-title::after {
        content: "";
        display: block;
        width: min(420px, 82%);
        height: 14px;
        margin-top: 14px;
        background: #f5821f;
      }
      .boot-subtitle {
        max-width: 520px;
        margin: 14px 0 0;
        color: rgba(255, 248, 231, 0.92);
        font-size: 1.25rem;
        font-weight: 800;
        line-height: 1.36;
      }
      .boot-meta {
        width: fit-content;
        margin-top: 10px;
        padding: 3px 14px 3px 10px;
        color: #fff8e7;
        background: rgba(18, 13, 11, 0.86);
        border-left: 5px solid #f5821f;
        font-family: "Bangers", Impact, "Arial Narrow Bold", sans-serif;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .boot-actions {
        height: 144px;
        margin-top: 22px;
      }
      @media (max-width: 720px) {
        .boot-scene::after {
          background: linear-gradient(180deg, rgba(14, 9, 7, 0.3) 0%, rgba(14, 9, 7, 0.7) 45%, rgba(14, 9, 7, 0.9) 100%);
        }
      }
      @media (max-width: 640px) {
        .boot {
          justify-content: flex-start;
          padding: 10px;
        }
      }
      @media (max-width: 560px) {
        .boot-copy {
          min-height: calc(100dvh - 40px);
          padding: 28px 22px;
        }
        .boot-title {
          font-size: 3.25rem;
          line-height: 0.9;
        }
        .boot-actions {
          height: 223px;
        }
      }
      @media (max-height: 600px) {
        .boot-copy {
          padding: 20px;
        }
        .boot-title {
          font-size: 3rem;
          line-height: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="boot">
        <div class="boot-hero">
          <div class="boot-scene"></div>
          <div class="boot-copy">
            <h1 class="boot-title">Explosive Shinobi Arena</h1>
            <p class="boot-subtitle">Clear the village. Outsmart the beasts. Survive your own blast.</p>
            <div class="boot-meta">Solo campaign · Local battle · Seven villages</div>
            <div class="boot-actions"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
