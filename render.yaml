# Render static site. Render reads this file only through a Blueprint; the
# service name must match the existing static site for the Blueprint to update it.
services:
  - type: web
    name: bomberman
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    headers:
      # Vite fingerprints everything it emits into /assets, so a file there
      # never changes under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Client-side routes such as /config and /game/... load the app shell.
      # Render serves a real file first when one exists at the path.
      - type: rewrite
        source: /*
        destination: /index.html
