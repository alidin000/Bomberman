# Render static site. Render reads this file only through a Blueprint; the
# service name must match the existing static site for the Blueprint to update it.
services:
  - type: web
    name: bomberman
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: VITE_GAME_SERVER_URL
        fromService:
          type: web
          name: bomberman-online
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      # Vite fingerprints everything it emits into /assets, so a file there
      # never changes under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Client-side routes such as /config and /game/... load the app shell.
      # Render serves a real file first when one exists at the path.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bomberman-online
    runtime: node
    plan: free
    buildCommand: npm ci && npm run server:build
    # Node itself, not `npm run`: npm does not pass SIGTERM on, so the server
    # could not tell its rooms about a deploy before Render stops it.
    startCommand: node server-dist/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: bomberman
          envVarKey: RENDER_EXTERNAL_URL
      # Per-address limits need the player's address. On Render every
      # connection arrives from the proxy, so 'socket' would put all players
      # under one key and the per-address caps would lock everyone out.
      # xff-left keys each normal browser by its real address, but it is NOT
      # YET VERIFIED. If Render keeps an X-Forwarded-For the client sent, one
      # client can send a new value per connection: no per-address limit
      # binds it, it can fill the server-wide room and socket caps so others
      # are turned away, and it can spend a real player's budgets by sending
      # that player's address. Run this check before relying on the limits:
      #   1. Deploy once with DEBUG_CLIENT_IP=1. Each handshake then logs the
      #      raw x-forwarded-for, cf-connecting-ip, true-client-ip and the
      #      socket address.
      #   2. From a laptop, open one WebSocket to the server with the game's
      #      origin and the headers X-Forwarded-For: 198.51.100.7 and
      #      CF-Connecting-IP: 198.51.100.8 (the ws package's headers option
      #      does this), then close it.
      #   3. Find your IP in the logged x-forwarded-for:
      #      198.51.100.7 is gone and your IP comes first: keep xff-left.
      #      198.51.100.7 is still there: use xff-right:<n>, where n is your
      #      IP's place counted from the right (1 when it is last).
      #      Your IP is missing: header:cf-connecting-ip, if that logged your
      #      real IP and not 198.51.100.8.
      #   4. Remove DEBUG_CLIENT_IP again: it logs raw addresses.
      - key: CLIENT_IP_SOURCE
        value: xff-left
      # Bearer token for /metrics, set in the dashboard. Unset, /metrics answers 404.
      # Use at least 16 characters: a shorter token stops the server at boot.
      - key: METRICS_TOKEN
        sync: false
